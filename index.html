<script>
const FULL_PRESSURE = 14.7

const modeSelect = document.getElementById("mode")
const fio2Block = document.getElementById("fio2Block")
const leakBlock = document.getElementById("leakBlock")
const ecmoBlock = document.getElementById("ecmoBlock")
const commonFlow = document.getElementById("commonFlow")

modeSelect.addEventListener("change",()=>{
 let m = modeSelect.value
 const flowLabel = document.getElementById("flowLabel")
 const flowInput = document.getElementById("flow")

 // 初期リセット
 commonFlow.style.display = "block"
 fio2Block.style.display = "none"
 leakBlock.style.display = "none"
 ecmoBlock.style.display = "none"

 if(m === "normal"){
  flowLabel.textContent = "酸素流量 (L/min)"
  flowInput.placeholder = "例: 5"
 }

 else if(m === "nppv"){
  fio2Block.style.display = "block"
  leakBlock.style.display = "block"
  flowLabel.textContent = "分時換気量 (MV) (L/min)"
  flowInput.placeholder = "例: 8"
 }

 else if(m === "hfnc"){
  fio2Block.style.display = "block"
  flowLabel.textContent = "酸素流量 (L/min)"
  flowInput.placeholder = "例: 40"
 }

 else if(m === "ecmo"){
  commonFlow.style.display = "none"   // ←重要修正
  fio2Block.style.display = "block"
  ecmoBlock.style.display = "block"
  document.getElementById("fio2").placeholder = "例: 100"
 }

 else{
  fio2Block.style.display = "block"
  flowLabel.textContent = "分時換気量 (MV) (L/min)"
  flowInput.placeholder = "例: 8"
 }
})

function calc(){

let mode = document.getElementById("mode").value
let pressure = parseFloat(document.getElementById("pressure").value)
let mv = parseFloat(document.getElementById("flow").value)
let cyl = parseFloat(document.getElementById("cylinder").value)

// ★FiO2安全化
let fio2Val = parseFloat(document.getElementById("fio2").value)
let fio2 = isNaN(fio2Val) ? 0 : fio2Val / 100

let leak = parseFloat(document.getElementById("leak")?.value || 0)
let safe = parseFloat(document.getElementById("safe").value)
let ecmoFlow = parseFloat(document.getElementById("ecmoFlow")?.value)

// 入力チェック
if(!mode){
 return show("モードを選択してください")
}

if(isNaN(pressure)){
 return show("ボンベ圧を入力してください")
}

// ★流量チェック
if(mode !== "ecmo" && isNaN(mv)){
 return show("流量を入力してください")
}

// ★FiO2必須チェック
if(mode !== "normal" && fio2 === 0){
 return show("FiO2を入力してください")
}

let oxygenFlow

if(mode === "normal"){
 oxygenFlow = mv
}
else if(mode === "nppv"){
 oxygenFlow = (mv + leak)*((fio2-0.21)/0.79)
}
else if(mode === "ecmo"){
 if(isNaN(ecmoFlow)) return show("G-Flowを入力してください")
 oxygenFlow = ecmoFlow*((fio2-0.21)/0.79)
}
else{
 oxygenFlow = mv*((fio2-0.21)/0.79)
}

// 計算エラー防止
if(!isFinite(oxygenFlow) || oxygenFlow <= 0){
 return show("入力値を確認してください")
}

// ★マイナス防止
let usable = Math.max(0, ((pressure - safe)/FULL_PRESSURE)*cyl)

// ★時間マイナス防止
let timeMin = Math.max(0, usable/oxygenFlow)

let remainingL = (pressure/FULL_PRESSURE)*cyl

// 色判定（少し厳しめ）
if(timeMin <= 5){
 document.body.className = "danger"
}
else if(timeMin <= 15){
 document.body.className = "warning"
}
else{
 document.body.className = "safe"
}

show(
"酸素消費量: "+oxygenFlow.toFixed(2)+" L/min<br>"+
"残量: "+remainingL.toFixed(0)+" L<br>"+
"使用可能時間: "+Math.round(timeMin)+" 分"
)
}

// 表示関数
function show(msg){
 document.getElementById("result").innerHTML = msg
}
</script>
